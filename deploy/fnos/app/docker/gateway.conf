# 把平台要求的 unix socket 接到 RustFS 的 TCP 控制台端口。
# 挂到 nginx 容器的 /etc/nginx/conf.d/default.conf（覆盖默认站点）。
#
# 注意两件事，都踩过：
#   1) upstream 必须写 **compose 里的服务名**（rustfs:9001），不能写 127.0.0.1 ——
#      两个容器不共享网络命名空间，127.0.0.1 指的是 nginx 自己。
#   2) gatewaySocket 是相对「应用根」的（app.sock），所以 socket 必须落在 ${TRIM_APPDEST}/app.sock；
#      本容器把 ${TRIM_APPDEST} 挂在 /sock，因此 listen 路径是 /sock/app.sock。
server {
    listen unix:/sock/app.sock;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ==========================================================================
    # HTML 注入：让「窗口内打开」时不用用户手填服务器地址
    #
    # 为什么需要：控制台是纯前端，登录页有一个「服务器地址」输入框，取值顺序是
    #   localStorage["rustfs-server-host"] → NEXT_PUBLIC_SERVER_HOST（build-time，运行期注入无效）
    #   → 兜底 http://localhost:9000（那是用户自己的电脑，永远连不上）。
    # 用 type:url 新标签打开时，页面 origin 就是控制台端口，用户登过一次 localStorage 就记住了；
    # 窗口内打开时 origin 变成平台地址（http://<NAS>:5666），是**另一个 origin**，拿不到那份记录。
    # 所以这里在 HTML 的 </head> 前插一段极小的脚本，替用户把它写上。
    #
    # 真机已验证（v17 验证轮）：
    #   · sub_filter 在 nginx:1.27-alpine 上可用，`</head>` 在首页**恰好出现 1 次**，命中成功；
    #   · **必须**保留 `proxy_set_header Accept-Encoding ""` —— 否则上游用 br/gzip 压缩，
    #     nginx 拿到的是压缩字节流，sub_filter 匹配不到（实测带 Accept-Encoding: br 也能命中，靠的就是这行）；
    #   · localStorage["rustfs-server-host"] 存的是**纯 URL 字符串**（控制台里 `new URL(e)` 直接解析，
    #     全程没有 JSON.parse），且它只取 `protocol//host`、**路径会被丢弃**
    #     → 所以注入写 `http://<host>:<port>` 就对了，**不需要带 /app/rustfs-fnos 前缀**。
    #
    # 写入策略（v17.2 起，这是「每次重装都要手动清一次」的修复）：
    #   localStorage 是**按 origin 持久保存**的 —— 之前装过的那版已经写进去一个旧端口的地址，
    #   重装后端口变了，旧值仍在。而 v17 的脚本只在「没有值」时才写，于是旧值一直挡着，
    #   用户必须手动清一次才能登。现在改成三种分支：
    #     ① 没有值                    → 写入；
    #     ② 有值，hostname 相同、端口不同 → **覆盖**（重装/改端口后的正常场景）；
    #     ③ 有值，hostname **不同**      → **不动**（用户可能故意指向另一台 NAS 或域名，尊重它）；
    #     ④ 有值但解析失败（坏值）      → 覆盖（坏值不如没有）。
    #   「端口相同」和「hostname 不同」两种情况都不写，所以不会每次刷新都重复 setItem。
    #
    # 端口值：脚本开头的 `var p = <数字>;` 由 cmd/install_callback 的 render_gateway_conf
    # 渲染成真实 API 端口（真源是 settings.env 的 API_PORT）。渲染幂等：按 `var p = <数字>;` 重写**所有**出现。
    # ⚠️ 脚本开头那个 `var p = <数字>;` 必须保持「单独一条语句、分号结尾」的形态 —— 渲染只认这个模式。
#    （写成 `var k=...,p = <数字>,...` 那种逗号连写会让渲染匹配不到，别优化掉。）
    #
    # 为什么用「精确 location」而不是前缀匹配：前缀匹配会把 _next 静态资源也纳入
    # proxy_buffering on + sub_filter 的处理范围 —— 既浪费内存（大 JS/CSS 要整体缓冲），
    # 也可能干扰二进制资源。只有真正返回 HTML 的路径才需要注入。
    # ==========================================================================

    # 首页（平台可能带尾斜杠）
    location = /app/rustfs-fnos/ {
        proxy_pass http://rustfs:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        sub_filter_once on;
        sub_filter '</head>' '<script>(function(){try{var p = 9200;var k="rustfs-server-host",s=window.localStorage,h=location.hostname;if(!s)return;var v=s.getItem(k);if(v){try{var u=new URL(v);if(u.hostname!==h)return;if(u.port===String(p))return;}catch(e){}}s.setItem(k,"http://"+h+":"+String(p));}catch(e){}})();</script></head>';
    }

    # 首页（不带尾斜杠）
    location = /app/rustfs-fnos {
        proxy_pass http://rustfs:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        sub_filter_once on;
        sub_filter '</head>' '<script>(function(){try{var p = 9200;var k="rustfs-server-host",s=window.localStorage,h=location.hostname;if(!s)return;var v=s.getItem(k);if(v){try{var u=new URL(v);if(u.hostname!==h)return;if(u.port===String(p))return;}catch(e){}}s.setItem(k,"http://"+h+":"+String(p));}catch(e){}})();</script></head>';
    }

    # 登录页：直接落到这个路径时也要注入（真机验证轮发现：只注入首页的话，
    # 直接打开 /auth/login/ 拿不到脚本；正常流程「根 → 前端路由」不会碰到，但收藏/刷新会）。
    location = /app/rustfs-fnos/auth/login/ {
        proxy_pass http://rustfs:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        sub_filter_once on;
        sub_filter '</head>' '<script>(function(){try{var p = 9200;var k="rustfs-server-host",s=window.localStorage,h=location.hostname;if(!s)return;var v=s.getItem(k);if(v){try{var u=new URL(v);if(u.hostname!==h)return;if(u.port===String(p))return;}catch(e){}}s.setItem(k,"http://"+h+":"+String(p));}catch(e){}})();</script></head>';
    }

    # 其余请求：原样转发，不做任何改写（含 _next 静态资源、SSE/流式响应）
    location / {
        proxy_pass http://rustfs:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # 对象上传/下载可能很大 —— 不限制请求体，避免大文件上传被 413 掐掉。
        client_max_body_size 0;
        # 控制台有长连接/流式响应的场景（日志、进度）—— 关掉缓冲让数据边到边转发。
        # 注意：这里**不能**开 buffering + sub_filter，那是上面三个精确 location 的事。
        proxy_buffering off;
        # 上游的 4xx/5xx 原样透出（例如未登录 403、路径不存在 404）。
        proxy_intercept_errors off;
    }
}
